services:
  threads-scraper:
    build: .
    image: threads-scraper:local
    init: true
    restart: unless-stopped
    # No published ports: only containers on ai-routing (Fami) reach
    # http://threads-scraper:8000/mcp.
    networks:
      - ai-routing
    environment:
      - PORT=8000
      # Optional — Threads does not rate-limit, so leave this unset.
      # - THREADS_PROXY=http://user:pass@host:port
      # - MCP_TOOL_TIMEOUT=45
      # - MCP_MAX_CONCURRENCY=4
      # - MCP_CACHE_SIZE=500
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-routing:
    external: true
    name: ai-routing
